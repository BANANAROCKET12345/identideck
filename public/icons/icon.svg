<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="52%" stop-color="#111C30" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>
    <linearGradient id="backCard" x1="96" y1="108" x2="416" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="midCard" x1="88" y1="156" x2="424" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="frontCard" x1="76" y1="196" x2="436" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#293952" />
      <stop offset="55%" stop-color="#182234" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="sheen" x1="76" y1="196" x2="320" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldChip" x1="116" y1="252" x2="196" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6DC93" />
      <stop offset="50%" stop-color="#D4A442" />
      <stop offset="100%" stop-color="#A87924" />
    </linearGradient>
  </defs>

  <!-- Squircle App Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" />

  <!-- Top Stacked Emerald Card -->
  <rect x="96" y="106" width="320" height="190" rx="28" fill="url(#backCard)" />
  <rect x="97.5" y="107.5" width="317" height="187" rx="26.5" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" />

  <!-- Middle Stacked Sky Card -->
  <rect x="84" y="152" width="344" height="204" rx="30" fill="url(#midCard)" />
  <rect x="85.5" y="153.5" width="341" height="201" rx="28.5" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="3" />

  <!-- Front Metallic Wallet Card -->
  <rect x="72" y="198" width="368" height="222" rx="32" fill="url(#frontCard)" />
  <rect x="72" y="198" width="368" height="222" rx="32" fill="url(#sheen)" />
  <rect x="73.5" y="199.5" width="365" height="219" rx="30.5" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" />

  <!-- Precision Gold SIM / Identity Chip -->
  <rect x="114" y="250" width="84" height="66" rx="14" fill="url(#goldChip)" />
  <path d="M114 274 H144 V250 M114 292 H144 V316 M198 274 H168 V250 M198 292 H168 V316 M144 274 H168 V292 H144 Z"
        stroke="#6B4A10" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.72" />

  <!-- Minimal Card Data Lines -->
  <rect x="226" y="262" width="166" height="16" rx="8" fill="#E2E8F0" fill-opacity="0.88" />
  <rect x="226" y="294" width="108" height="14" rx="7" fill="#94A3B8" fill-opacity="0.58" />

  <!-- Subtle Connection Nodes on Bottom Right -->
  <circle cx="130" cy="364" r="10" fill="#38BDF8" />
  <circle cx="164" cy="364" r="10" fill="#10B981" />
  <rect x="308" y="354" width="84" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.12" />
</svg>
