<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>IdentiDeck · 身份卡包</title>
    <meta
      name="description"
      content="Apple Wallet 极简拟物账号身份与关系图谱 PWA — 零密码存储，离线可用，端到端 AES-256-GCM 加密同步。"
    />
    <meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090E17" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA Native Standalone Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IdentiDeck" />
    <meta name="format-detection" content="telephone=no" />

    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Typography: Inter + JetBrains Mono + Noto Sans SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent dark-mode flash before React hydration -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('identideck_theme');
          var isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
